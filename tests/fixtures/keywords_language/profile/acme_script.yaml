language: acme_script
version: 1
format_version: 1
source: manual
status: approved
extensions: [".acs"]
case_sensitive: false
comments: { line: ["#"], block: [["/*", "*/"]] }
strings: ['"']
definitions:
  - { keywords: ["proc"], name: after_keyword, end_keywords: ["endproc"], kind: routine }
  - { keywords: ["function"], name: after_keyword, end_keywords: ["endfunction"], kind: routine }
calls:
  - { keywords: ["run"], name: after_keyword }
  - { style: name_then_paren, only_known_names: true }
includes:
  - { keywords: ["use"], target: after_keyword }
evidence:
  document: "manual.md"
  samples: ["scripts/main.acs", "scripts/helpers.acs"]
