# tests/corpus/code_aster_start/expectations.yaml — Code_Aster 17.5.7 (examples checked in the sources)
inventory:
  languages: { fortran: { min_files: 100 }, python: { min_files: 10 }, cpp: { min_files: 10 }, c: { min_files: 1 } }
  max_unknown_rate: 0.01
expect:
  - node: "f:mmbouc"                              # contact loop (mmalgo no longer exists in v17)
  - node: "f:nmstat"
  - hidden: "f:utmess"
  - hidden: "f:jemarq"
  - no_call_to: ["f:zr", "f:zi", "f:zc", "f:zl", "f:zk8", "f:zk16", "f:zk24", "f:zk32", "f:zk80"]
  - writes: { routine: "f:nmener", data: "data:mem:*.VALE", key_kind: family }
  - edge: { src: "cpp:BaseMesh::readMeshFile(const std::filesystem::path&,const std::string&,const int)",
            dst: "f:execop", kind: bridges }
  - path: { from: "entry:STAT_NON_LINE", to: "f:op0070", max_len: 2, edge_kinds: call_path }
  - dispatches: { src: "f:te0000", min_targets: 500 }
  - dispatches: { src: "f:lc0000", min_targets: 50 }
  - out_of_scope_allowed: ["f:op*", "f:te*", "f:lc*"]   # defined outside the start scope
metrics:
  min_recall_definitions: 0.99
  min_recall_call_sites: 0.97
  min_precision_resolved: 0.98                    # per language
  min_precision_lower_bound: 0.95
  max_unresolved_rate: 0.02
  max_parse_failure_rate: 0.02
