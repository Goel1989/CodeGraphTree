name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/lock_dependencies.py --check
      - run: python tools/check.py --fast
